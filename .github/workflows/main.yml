name: checkin-bus

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
      # Play đã có versionCode 22 → cộng thêm mốc này để chắc chắn không bao giờ trùng
      VERSION_CODE_BASE: "25"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full history để đếm số commit chính xác

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Add build-tools to PATH
        run: echo "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vue.js)
        run: npm run build

      - name: Sync with Capacitor
        run: npx cap sync android

      # Giải mã keystore cố định từ secret (KHÔNG tạo mới mỗi lần build,
      # nếu không app sẽ không thể update trên Play Store)
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/checkin-bus-release.jks

      # APK (cài tay) + AAB (Play Store), cùng keystore.
      # versionCode = số lượng commit trong repo + VERSION_CODE_BASE
      # → LUÔN tăng chỉ khi có commit mới thật sự, không đổi dù re-run job
      #   nhiều lần (khác với dùng github.run_number, vốn không tăng khi re-run).
      - name: Build Android APK and App Bundle (Release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$(( COMMIT_COUNT + VERSION_CODE_BASE ))
          echo "Building versionCode=${VERSION_CODE} versionName=1.0.1 (commit_count=${COMMIT_COUNT})"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PappVersionCode=$VERSION_CODE \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/keystore/checkin-bus-release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkin-bus-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkin-bus-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # Tự động đẩy lên Google Play (kênh Internal testing).
      # LƯU Ý: chỉ hoạt động sau khi đã nộp bản đầu tiên THỦ CÔNG qua web
      # (Google Play Developer API không cho tạo release đầu tiên của app).
      - name: Upload to Google Play (Internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.jiahsin.bus
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed